name: TestFlight Upload

on:
  push:
    branches:
      - main

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_GEMFILE: family-rosary/Gemfile
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build and upload to TestFlight
        timeout-minutes: 35
        working-directory: family-rosary
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios beta

      - name: Direct xcodebuild archive diagnostic
        if: failure()
        continue-on-error: true
        timeout-minutes: 12
        working-directory: family-rosary
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project family-rosary.xcodeproj \
            -scheme family-rosary \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/family-rosary-direct.xcarchive" \
            2>&1 | tee "$RUNNER_TEMP/direct-xcodebuild-archive.log"

      - name: Failure archive forensic dump
        if: failure()
        continue-on-error: true
        working-directory: family-rosary
        shell: bash
        run: |
          source_entitlements="FamilyRosaryShareExtension/FamilyRosaryShareExtension.entitlements"
          {
            echo "=== ps aux snapshot ==="
            ps aux | grep -E 'codesign|xcodebuild|XCBBuildService' | grep -v grep || true
          } | tee "$RUNNER_TEMP/failure-process-snapshot.log"

          {
            echo "=== source extension entitlements ==="
            if [ -f "$source_entitlements" ]; then
              plutil -p "$source_entitlements"
            else
              echo "MISSING: $source_entitlements"
            fi
          } | tee "$RUNNER_TEMP/source-extension-entitlements.log"

          built_appex="$(find "$RUNNER_TEMP" "$HOME/Library/Developer/Xcode/DerivedData" -type d -name 'FamilyRosaryShareExtension.appex' 2>/dev/null | head -n 1)"
          {
            echo "=== built appex path ==="
            if [ -n "$built_appex" ]; then
              echo "$built_appex"
            else
              echo "MISSING"
            fi
            echo
            echo "=== built appex recursive listing ==="
            if [ -n "$built_appex" ]; then
              ls -laR "$built_appex"
            else
              echo "MISSING"
            fi
          } | tee "$RUNNER_TEMP/built-appex-listing.log"

          generated_xcent="$(find "$RUNNER_TEMP" "$HOME/Library/Developer/Xcode/DerivedData" -type f \\( -name '*.xcent' -o -name '*.xcent.der' \\) 2>/dev/null | grep 'FamilyRosaryShareExtension' | head -n 1 || true)"
          {
            echo "=== generated extension xcent path ==="
            if [ -n "$generated_xcent" ]; then
              echo "$generated_xcent"
            else
              echo "MISSING"
            fi
            echo
            echo "=== generated extension xcent contents ==="
            if [ -n "$generated_xcent" ]; then
              plutil -p "$generated_xcent" || cat "$generated_xcent" || true
            else
              echo "MISSING"
            fi
          } | tee "$RUNNER_TEMP/generated-extension-xcent.log"

      - name: Failure process snapshot
        if: failure()
        shell: bash
        run: |
          ps aux | grep -E 'xcodebuild|codesign|XCBBuildService|swift' | grep -v grep || true

      - name: Upload archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-beta-archive-diagnostics
          if-no-files-found: warn
          path: |
            /Users/runner/Library/Logs/gym/**/*.log
            ${{ runner.temp }}/direct-xcodebuild-archive.log
            ${{ runner.temp }}/failure-process-snapshot.log
            ${{ runner.temp }}/source-extension-entitlements.log
            ${{ runner.temp }}/built-appex-listing.log
            ${{ runner.temp }}/generated-extension-xcent.log

name: TestFlight Upload

on:
  push:
    branches:
      - main

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_GEMFILE: family-rosary/Gemfile
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build and upload to TestFlight
        timeout-minutes: 35
        working-directory: family-rosary
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios beta

      - name: Direct xcodebuild archive diagnostic
        if: failure()
        continue-on-error: true
        timeout-minutes: 12
        working-directory: family-rosary
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project family-rosary.xcodeproj \
            -scheme family-rosary \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/family-rosary-direct.xcarchive" \
            2>&1 | tee "$RUNNER_TEMP/direct-xcodebuild-archive.log"

      - name: Failure process snapshot
        if: failure()
        shell: bash
        run: |
          ps aux | grep -E 'xcodebuild|codesign|XCBBuildService|swift' | grep -v grep || true

      - name: Upload archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-beta-archive-diagnostics
          if-no-files-found: warn
          path: |
            /Users/runner/Library/Logs/gym/**/*.log
            ${{ runner.temp }}/direct-xcodebuild-archive.log
